name: CI/CD — Test & Deploy to Railway

on:
  push:
    branches: [main]
    paths:
      - 'T11/**'
  pull_request:
    branches: [main]
    paths:
      - 'T11/**'

defaults:
  run:
    working-directory: T11

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: T11/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          MONGODB_TEST_URI: ${{ secrets.MONGODB_TEST_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_EXPIRES_IN: 2h
          NODE_ENV: test
        run: npm test

  deploy:
    name: Deploy to Railway
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach --service podcasthub
