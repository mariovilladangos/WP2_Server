<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatIO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    header {
      background: #16213e; padding: 0.75rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid #0f3460; flex-shrink: 0;
    }
    header h1 { color: #667eea; font-size: 1.4rem; }
    .header-user { display: flex; align-items: center; gap: 0.75rem; }
    .username-badge { background: #667eea; color: #fff; padding: 0.3rem 0.75rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }
    .btn-logout { background: transparent; border: 1px solid #e53e3e; color: #e53e3e; padding: 0.3rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-logout:hover { background: #e53e3e; color: #fff; }
    .btn-notif { background: transparent; border: 1px solid #667eea; color: #667eea; padding: 0.3rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem; }
    .btn-notif:hover { background: #667eea; color: #fff; }

    /* Layout */
    .layout { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    .sidebar {
      width: 260px; background: #16213e; border-right: 1px solid #0f3460;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-section { padding: 1rem; border-bottom: 1px solid #0f3460; }
    .sidebar-section h3 { font-size: 0.75rem; text-transform: uppercase; color: #667eea; letter-spacing: 1px; margin-bottom: 0.75rem; }
    .btn-create {
      width: 100%; padding: 0.5rem; background: #667eea; color: #fff;
      border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .btn-create:hover { background: #5a6fd6; }
    .room-list { list-style: none; }
    .room-item {
      padding: 0.5rem 0.75rem; cursor: pointer; border-radius: 6px;
      font-size: 0.9rem; color: #aaa; transition: all 0.15s;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .room-item:hover { background: #0f3460; color: #fff; }
    .room-item.active { background: #667eea; color: #fff; }
    .room-icon { font-size: 1rem; }
    .online-list { list-style: none; flex: 1; overflow-y: auto; padding: 0.5rem 1rem; }
    .online-item { padding: 0.35rem 0; font-size: 0.85rem; color: #aaa; display: flex; align-items: center; gap: 0.5rem; cursor: pointer; }
    .online-dot { width: 8px; height: 8px; background: #48bb78; border-radius: 50%; flex-shrink: 0; }
    .online-item:hover { color: #fff; }

    /* Main chat area */
    .chat-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

    /* Chat header */
    .chat-header {
      padding: 0.75rem 1.5rem; background: #16213e;
      border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 1rem; flex-shrink: 0;
    }
    .chat-header h2 { font-size: 1.1rem; color: #eee; }
    .chat-header .room-desc { font-size: 0.8rem; color: #888; }
    .search-wrap { margin-left: auto; display: flex; gap: 0.5rem; }
    .search-input {
      padding: 0.35rem 0.75rem; background: #0f3460; border: 1px solid #667eea;
      border-radius: 6px; color: #eee; font-size: 0.85rem; width: 200px;
    }
    .search-input:focus { outline: none; }
    .btn-search { padding: 0.35rem 0.75rem; background: #667eea; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }

    /* Messages */
    .messages {
      flex: 1; overflow-y: auto; padding: 1rem 1.5rem;
      display: flex; flex-direction: column; gap: 0.75rem;
    }
    .message {
      display: flex; gap: 0.75rem; align-items: flex-start;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; } }
    .message.own { flex-direction: row-reverse; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%; background: #667eea;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .bubble {
      max-width: 60%; background: #0f3460; border-radius: 12px; padding: 0.6rem 1rem;
      position: relative;
    }
    .message.own .bubble { background: #667eea; }
    .bubble .sender { font-size: 0.75rem; font-weight: 700; color: #667eea; margin-bottom: 0.2rem; }
    .message.own .bubble .sender { color: #fff; opacity: 0.8; }
    .bubble .text { font-size: 0.92rem; word-break: break-word; }
    .bubble .text img { max-width: 100%; max-height: 200px; border-radius: 8px; display: block; margin-top: 0.3rem; }
    .bubble .meta { font-size: 0.7rem; color: #aaa; margin-top: 0.3rem; display: flex; align-items: center; gap: 0.4rem; }
    .message.own .bubble .meta { color: rgba(255,255,255,0.7); }
    .deleted-msg { font-style: italic; color: #888 !important; }
    .edited-badge { font-size: 0.65rem; color: #aaa; }
    .reactions-bar { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.3rem; }
    .reaction-btn {
      background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px; padding: 0.15rem 0.4rem; font-size: 0.8rem; cursor: pointer;
      color: #eee; transition: background 0.15s;
    }
    .reaction-btn:hover { background: rgba(255,255,255,0.2); }
    .msg-actions {
      display: none; position: absolute; right: 0.5rem; top: 0.5rem;
      gap: 0.3rem;
    }
    .bubble:hover .msg-actions { display: flex; }
    .msg-action-btn { background: rgba(0,0,0,0.4); border: none; color: #eee; font-size: 0.75rem; padding: 0.2rem 0.4rem; border-radius: 4px; cursor: pointer; }
    .msg-action-btn:hover { background: rgba(0,0,0,0.6); }

    /* Typing indicator */
    .typing-indicator {
      padding: 0 1.5rem 0.5rem; font-size: 0.8rem; color: #667eea; min-height: 1.5rem;
      font-style: italic;
    }

    /* Input bar */
    .input-bar {
      padding: 0.75rem 1.5rem; background: #16213e;
      border-top: 1px solid #0f3460; display: flex; gap: 0.75rem; align-items: flex-end;
    }
    .emoji-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; padding: 0.3rem; line-height: 1; flex-shrink: 0; }
    .image-btn { background: none; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.35rem; line-height: 1; color: #667eea; flex-shrink: 0; }
    #imageInput { display: none; }
    .msg-input {
      flex: 1; background: #0f3460; border: 1px solid #0f3460; border-radius: 8px;
      padding: 0.6rem 1rem; color: #eee; font-size: 0.95rem; resize: none;
      max-height: 120px; transition: border 0.2s;
    }
    .msg-input:focus { outline: none; border-color: #667eea; }
    .send-btn { background: #667eea; border: none; color: #fff; padding: 0.6rem 1.2rem; border-radius: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 700; flex-shrink: 0; }
    .send-btn:hover { background: #5a6fd6; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Emoji picker */
    .emoji-picker {
      position: absolute; bottom: 70px; left: 1.5rem;
      background: #16213e; border: 1px solid #0f3460; border-radius: 12px;
      padding: 0.75rem; display: none; gap: 0.4rem; flex-wrap: wrap;
      width: 260px; z-index: 100; box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .emoji-picker.open { display: flex; }
    .emoji-opt { font-size: 1.3rem; cursor: pointer; padding: 0.2rem; border-radius: 4px; transition: transform 0.1s; }
    .emoji-opt:hover { transform: scale(1.3); }

    /* Private message modal */
    .modal-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
      z-index: 200; align-items: center; justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #16213e; border: 1px solid #0f3460; border-radius: 12px;
      padding: 1.5rem; width: 380px; max-width: 90vw;
    }
    .modal h3 { color: #667eea; margin-bottom: 1rem; }
    .modal input, .modal textarea {
      width: 100%; background: #0f3460; border: 1px solid #667eea;
      border-radius: 6px; color: #eee; padding: 0.6rem; font-size: 0.9rem; margin-bottom: 0.75rem;
    }
    .modal textarea { resize: vertical; min-height: 80px; }
    .modal-actions { display: flex; gap: 0.75rem; justify-content: flex-end; }
    .btn-cancel { padding: 0.5rem 1rem; background: transparent; border: 1px solid #888; color: #888; border-radius: 6px; cursor: pointer; }
    .btn-send-pm { padding: 0.5rem 1rem; background: #667eea; border: none; color: #fff; border-radius: 6px; cursor: pointer; font-weight: 600; }

    /* Notifications panel */
    .notif-panel {
      position: fixed; bottom: 1rem; right: 1rem;
      display: flex; flex-direction: column; gap: 0.5rem; z-index: 300;
    }
    .notif {
      background: #16213e; border: 1px solid #667eea; border-radius: 8px;
      padding: 0.75rem 1rem; max-width: 300px; font-size: 0.85rem;
      animation: slideIn 0.3s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .notif strong { color: #667eea; display: block; }

    /* Empty state */
    .empty-state {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; color: #555; gap: 1rem;
    }
    .empty-state .icon { font-size: 4rem; }
    .empty-state p { font-size: 1rem; }

    /* Private messages log */
    .pm-log { max-height: 300px; overflow-y: auto; margin-bottom: 0.75rem; }
    .pm-msg { padding: 0.4rem 0; border-bottom: 1px solid #0f3460; font-size: 0.85rem; }
    .pm-msg strong { color: #667eea; }
    .pm-msg.self strong { color: #48bb78; }
  </style>
</head>
<body>
  <!-- Header -->
  <header>
    <h1>💬 ChatIO</h1>
    <div class="header-user">
      <button class="btn-notif" id="btnNotif" title="Activar notificaciones">🔔 Notificaciones</button>
      <span class="username-badge" id="currentUsername">...</span>
      <button class="btn-logout" id="btnLogout">Salir</button>
    </div>
  </header>

  <div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-section">
        <h3>Salas</h3>
        <button class="btn-create" id="btnCreateRoom">+ Nueva sala</button>
        <ul class="room-list" id="roomList"></ul>
      </div>
      <div class="sidebar-section" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
        <h3>Online</h3>
        <ul class="online-list" id="onlineList"></ul>
      </div>
    </div>

    <!-- Chat -->
    <div class="chat-area" id="chatArea">
      <div class="empty-state" id="emptyState">
        <div class="icon">💬</div>
        <p>Selecciona una sala para comenzar a chatear</p>
      </div>

      <div id="chatContent" style="display:none; flex:1; overflow:hidden; display:none; flex-direction:column;">
        <div class="chat-header" id="chatHeader">
          <div>
            <h2 id="chatRoomName">Sala</h2>
            <div class="room-desc" id="chatRoomDesc"></div>
          </div>
          <div class="search-wrap">
            <input class="search-input" id="searchInput" placeholder="Buscar mensajes..." />
            <button class="btn-search" id="btnSearch">🔍</button>
          </div>
        </div>
        <div class="messages" id="messages"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="input-bar" style="position:relative;">
          <div class="emoji-picker" id="emojiPicker">
            <span class="emoji-opt">😀</span><span class="emoji-opt">😂</span><span class="emoji-opt">😍</span>
            <span class="emoji-opt">🤔</span><span class="emoji-opt">👍</span><span class="emoji-opt">👎</span>
            <span class="emoji-opt">❤️</span><span class="emoji-opt">🔥</span><span class="emoji-opt">🎉</span>
            <span class="emoji-opt">😭</span><span class="emoji-opt">😡</span><span class="emoji-opt">🤣</span>
            <span class="emoji-opt">✅</span><span class="emoji-opt">❌</span><span class="emoji-opt">💯</span>
            <span class="emoji-opt">🙌</span><span class="emoji-opt">😎</span><span class="emoji-opt">🤝</span>
          </div>
          <button class="emoji-btn" id="btnEmoji" title="Emojis">😊</button>
          <input type="file" id="imageInput" accept="image/*" />
          <button class="image-btn" id="btnImage" title="Enviar imagen">📷</button>
          <textarea class="msg-input" id="msgInput" placeholder="Escribe un mensaje..." rows="1"></textarea>
          <button class="send-btn" id="btnSend">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Private Message Modal -->
  <div class="modal-overlay" id="pmModal">
    <div class="modal">
      <h3>💌 Mensaje privado</h3>
      <div class="pm-log" id="pmLog"></div>
      <input type="text" id="pmTo" placeholder="ID del usuario destinatario" readonly />
      <input type="text" id="pmToName" placeholder="Usuario" readonly />
      <textarea id="pmContent" placeholder="Escribe tu mensaje privado..."></textarea>
      <div class="modal-actions">
        <button class="btn-cancel" id="btnCancelPM">Cancelar</button>
        <button class="btn-send-pm" id="btnSendPM">Enviar</button>
      </div>
    </div>
  </div>

  <!-- Notifications panel -->
  <div class="notif-panel" id="notifPanel"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // --- State ---
    const token = localStorage.getItem('chat_token');
    const currentUser = JSON.parse(localStorage.getItem('chat_user') || 'null');

    if (!token || !currentUser) {
      window.location.href = '/';
    }

    document.getElementById('currentUsername').textContent = currentUser.username;

    let socket = null;
    let currentRoomId = null;
    let rooms = [];
    let onlineUsers = {};
    let typingTimeout = null;
    let typingUsers = {};

    // --- Socket.IO ---
    function connectSocket() {
      socket = io({ auth: { token } });

      socket.on('connect', () => {
        console.log('Conectado al servidor');
        loadRooms();
      });

      socket.on('connect_error', (err) => {
        showNotif('Error de conexión', err.message);
        localStorage.removeItem('chat_token');
        localStorage.removeItem('chat_user');
        setTimeout(() => window.location.href = '/', 2000);
      });

      socket.on('room:joined', ({ room, users, messages }) => {
        currentRoomId = room._id;
        document.getElementById('chatRoomName').textContent = '# ' + room.name;
        document.getElementById('chatRoomDesc').textContent = room.description || '';
        showChatContent();
        renderMessages(messages);
        updateRoomHighlight();
      });

      socket.on('room:user-joined', ({ user }) => {
        showNotif('👤 Entró a la sala', user.username);
        appendSystemMsg(user.username + ' se unió a la sala');
      });

      socket.on('room:user-left', ({ user }) => {
        appendSystemMsg(user.username + ' salió de la sala');
      });

      socket.on('chat:message', (msg) => {
        appendMessage(msg);
        // Desktop notification if window not focused
        if (document.hidden && Notification.permission === 'granted') {
          new Notification('ChatIO – ' + msg.user.username, {
            body: msg.type === 'image' ? '📷 Imagen' : msg.content,
            icon: '/favicon.ico',
          });
        }
      });

      socket.on('chat:typing', ({ user }) => {
        if (user._id === currentUser._id) return;
        typingUsers[user._id] = user.username;
        renderTyping();
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => {
          delete typingUsers[user._id];
          renderTyping();
        }, 2500);
      });

      socket.on('user:online', ({ userId, username }) => {
        onlineUsers[userId] = username;
        renderOnlineList();
        showNotif('🟢 Online', username);
      });

      socket.on('user:offline', ({ userId }) => {
        delete onlineUsers[userId];
        renderOnlineList();
      });

      socket.on('message:private', (msg) => {
        addPmToLog(msg);
        showNotif('💌 Mensaje privado', (msg.self ? 'Enviado' : 'De: ' + msg.from?.username) + ': ' + msg.content);
      });

      socket.on('message:reaction', ({ messageId, reactions }) => {
        const el = document.querySelector(`[data-msg-id="${messageId}"] .reactions-bar`);
        if (el) renderReactions(el, messageId, reactions);
      });

      socket.on('message:edited', ({ messageId, content }) => {
        const el = document.querySelector(`[data-msg-id="${messageId}"] .text`);
        if (el) {
          el.textContent = content;
          const meta = document.querySelector(`[data-msg-id="${messageId}"] .edited-badge`);
          if (meta) meta.style.display = 'inline';
        }
      });

      socket.on('message:deleted', ({ messageId }) => {
        const el = document.querySelector(`[data-msg-id="${messageId}"] .text`);
        if (el) { el.textContent = '[Mensaje eliminado]'; el.classList.add('deleted-msg'); }
      });

      socket.on('error', ({ message }) => {
        showNotif('⚠️ Error', message);
      });
    }

    // --- Rooms ---
    async function loadRooms() {
      try {
        const res = await fetch('/api/rooms', { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        rooms = data.rooms || [];
        renderRoomList();
      } catch {}
    }

    function renderRoomList() {
      const ul = document.getElementById('roomList');
      ul.innerHTML = '';
      rooms.forEach(room => {
        const li = document.createElement('li');
        li.className = 'room-item' + (room._id === currentRoomId ? ' active' : '');
        li.dataset.roomId = room._id;
        li.innerHTML = `<span class="room-icon">${room.isPrivate ? '🔒' : '#'}</span>${room.name}`;
        li.addEventListener('click', () => joinRoom(room._id));
        ul.appendChild(li);
      });
    }

    function updateRoomHighlight() {
      document.querySelectorAll('.room-item').forEach(el => {
        el.classList.toggle('active', el.dataset.roomId === currentRoomId);
      });
    }

    function joinRoom(roomId) {
      if (currentRoomId && currentRoomId !== roomId) {
        socket.emit('room:leave', { roomId: currentRoomId });
      }
      socket.emit('room:join', { roomId });
    }

    // --- Create room ---
    document.getElementById('btnCreateRoom').addEventListener('click', async () => {
      const name = prompt('Nombre de la sala:');
      if (!name || !name.trim()) return;
      const desc = prompt('Descripción (opcional):') || '';
      try {
        const res = await fetch('/api/rooms', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ name: name.trim(), description: desc }),
        });
        const data = await res.json();
        if (!res.ok) { alert(data.message); return; }
        rooms.unshift(data.room);
        renderRoomList();
        joinRoom(data.room._id);
      } catch (e) { alert('Error al crear sala'); }
    });

    // --- Messages ---
    function renderMessages(msgs) {
      const container = document.getElementById('messages');
      container.innerHTML = '';
      msgs.forEach(m => appendMessage({
        _id: m._id,
        user: m.sender,
        content: m.content,
        type: m.type,
        reactions: m.reactions,
        isEdited: m.isEdited,
        isDeleted: m.isDeleted,
        timestamp: m.createdAt,
      }));
      container.scrollTop = container.scrollHeight;
    }

    function appendMessage(msg) {
      const container = document.getElementById('messages');
      const isOwn = msg.user?._id === currentUser._id || msg.user?._id?.toString() === currentUser._id?.toString();
      const div = document.createElement('div');
      div.className = 'message' + (isOwn ? ' own' : '');
      div.dataset.msgId = msg._id;

      const initial = (msg.user?.username || '?')[0].toUpperCase();
      const time = new Date(msg.timestamp || msg.createdAt).toLocaleTimeString('es', { hour: '2-digit', minute: '2-digit' });

      let contentHtml = '';
      if (msg.isDeleted) {
        contentHtml = `<span class="deleted-msg">[Mensaje eliminado]</span>`;
      } else if (msg.type === 'image') {
        contentHtml = `<img src="${escHtml(msg.content)}" alt="imagen" />`;
      } else {
        contentHtml = escHtml(msg.content);
      }

      div.innerHTML = `
        <div class="avatar">${initial}</div>
        <div class="bubble">
          <div class="sender">${escHtml(msg.user?.username || 'Anónimo')}</div>
          <div class="text">${contentHtml}</div>
          <div class="meta">
            <span>${time}</span>
            <span class="edited-badge" style="display:${msg.isEdited ? 'inline' : 'none'}">(editado)</span>
          </div>
          <div class="reactions-bar"></div>
          <div class="msg-actions">
            <button class="msg-action-btn" onclick="reactMsg('${msg._id}')">😊</button>
            ${isOwn && !msg.isDeleted ? `<button class="msg-action-btn" onclick="editMsg('${msg._id}')">✏️</button>` : ''}
            ${isOwn && !msg.isDeleted ? `<button class="msg-action-btn" onclick="deleteMsg('${msg._id}')">🗑️</button>` : ''}
          </div>
        </div>`;

      if (msg.reactions?.length) {
        const bar = div.querySelector('.reactions-bar');
        renderReactions(bar, msg._id, msg.reactions);
      }

      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function appendSystemMsg(text) {
      const container = document.getElementById('messages');
      const div = document.createElement('div');
      div.style.cssText = 'text-align:center; color:#555; font-size:0.8rem; padding:0.25rem;';
      div.textContent = text;
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
    }

    function renderReactions(bar, msgId, reactions) {
      bar.innerHTML = '';
      const grouped = {};
      reactions.forEach(r => { grouped[r.emoji] = (grouped[r.emoji] || 0) + 1; });
      Object.entries(grouped).forEach(([emoji, count]) => {
        const btn = document.createElement('button');
        btn.className = 'reaction-btn';
        btn.textContent = emoji + ' ' + count;
        btn.onclick = () => socket.emit('message:react', { messageId: msgId, emoji });
        bar.appendChild(btn);
      });
    }

    function renderTyping() {
      const names = Object.values(typingUsers);
      const el = document.getElementById('typingIndicator');
      if (names.length === 0) { el.textContent = ''; return; }
      el.textContent = names.join(', ') + (names.length === 1 ? ' está escribiendo...' : ' están escribiendo...');
    }

    // --- Send message ---
    document.getElementById('btnSend').addEventListener('click', sendMessage);
    document.getElementById('msgInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });
    document.getElementById('msgInput').addEventListener('input', () => {
      if (currentRoomId) socket.emit('chat:typing', { roomId: currentRoomId });
    });

    function sendMessage() {
      const input = document.getElementById('msgInput');
      const content = input.value.trim();
      if (!content || !currentRoomId) return;
      socket.emit('chat:message', { roomId: currentRoomId, content, type: 'text' });
      input.value = '';
    }

    // --- Image upload ---
    document.getElementById('btnImage').addEventListener('click', () => document.getElementById('imageInput').click());
    document.getElementById('imageInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file || !currentRoomId) return;
      const reader = new FileReader();
      reader.onload = () => {
        socket.emit('chat:message', { roomId: currentRoomId, content: reader.result, type: 'image' });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    // --- Emoji picker ---
    document.getElementById('btnEmoji').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('emojiPicker').classList.toggle('open');
    });
    document.querySelectorAll('.emoji-opt').forEach(btn => {
      btn.addEventListener('click', () => {
        document.getElementById('msgInput').value += btn.textContent;
        document.getElementById('emojiPicker').classList.remove('open');
        document.getElementById('msgInput').focus();
      });
    });
    document.addEventListener('click', () => document.getElementById('emojiPicker').classList.remove('open'));

    // --- Message actions ---
    window.reactMsg = (msgId) => {
      const emoji = prompt('Ingresa un emoji para reaccionar:');
      if (!emoji) return;
      socket.emit('message:react', { messageId: msgId, emoji: emoji.trim() });
    };
    window.editMsg = async (msgId) => {
      const el = document.querySelector(`[data-msg-id="${msgId}"] .text`);
      const newContent = prompt('Editar mensaje:', el?.textContent || '');
      if (!newContent || !newContent.trim()) return;
      socket.emit('message:edit', { messageId: msgId, content: newContent.trim() });
    };
    window.deleteMsg = (msgId) => {
      if (!confirm('¿Eliminar este mensaje?')) return;
      socket.emit('message:delete', { messageId: msgId });
    };

    // --- Search ---
    document.getElementById('btnSearch').addEventListener('click', searchMessages);
    document.getElementById('searchInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') searchMessages(); });
    async function searchMessages() {
      const q = document.getElementById('searchInput').value.trim();
      if (!currentRoomId) return;
      const url = `/api/rooms/${currentRoomId}/messages` + (q ? `?q=${encodeURIComponent(q)}` : '');
      try {
        const res = await fetch(url, { headers: { Authorization: 'Bearer ' + token } });
        const data = await res.json();
        renderMessages(data.messages || []);
        if (q) appendSystemMsg(`Resultados para "${q}": ${data.messages?.length || 0} mensajes`);
      } catch {}
    }

    // --- Online users ---
    function renderOnlineList() {
      const ul = document.getElementById('onlineList');
      ul.innerHTML = '';
      Object.entries(onlineUsers).forEach(([id, name]) => {
        const li = document.createElement('li');
        li.className = 'online-item';
        li.innerHTML = `<span class="online-dot"></span>${escHtml(name)}`;
        li.title = 'Enviar mensaje privado';
        li.addEventListener('click', () => openPMModal(id, name));
        ul.appendChild(li);
      });
    }

    // --- Private messages ---
    function openPMModal(userId, username) {
      document.getElementById('pmTo').value = userId;
      document.getElementById('pmToName').value = username;
      document.getElementById('pmContent').value = '';
      document.getElementById('pmModal').classList.add('open');
    }
    document.getElementById('btnCancelPM').addEventListener('click', () => {
      document.getElementById('pmModal').classList.remove('open');
    });
    document.getElementById('btnSendPM').addEventListener('click', () => {
      const to = document.getElementById('pmTo').value;
      const content = document.getElementById('pmContent').value.trim();
      if (!content) return;
      socket.emit('message:private', { to, content });
      document.getElementById('pmContent').value = '';
    });
    function addPmToLog(msg) {
      const log = document.getElementById('pmLog');
      const div = document.createElement('div');
      div.className = 'pm-msg' + (msg.self ? ' self' : '');
      const name = msg.self ? 'Tú' : (msg.from?.username || 'Desconocido');
      div.innerHTML = `<strong>${escHtml(name)}</strong>: ${escHtml(msg.content)}`;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    // --- Desktop notifications ---
    document.getElementById('btnNotif').addEventListener('click', async () => {
      if (!('Notification' in window)) { alert('Este navegador no soporta notificaciones'); return; }
      const perm = await Notification.requestPermission();
      if (perm === 'granted') {
        document.getElementById('btnNotif').textContent = '🔔 Activadas';
        showNotif('✅ Notificaciones', 'Las notificaciones de escritorio están activadas');
      }
    });

    // --- Notifications UI ---
    function showNotif(title, body) {
      const panel = document.getElementById('notifPanel');
      const div = document.createElement('div');
      div.className = 'notif';
      div.innerHTML = `<strong>${escHtml(title)}</strong>${escHtml(body)}`;
      panel.appendChild(div);
      setTimeout(() => div.remove(), 4000);
    }

    // --- Helpers ---
    function escHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function showChatContent() {
      document.getElementById('emptyState').style.display = 'none';
      const cc = document.getElementById('chatContent');
      cc.style.display = 'flex';
      cc.style.flexDirection = 'column';
      cc.style.flex = '1';
      cc.style.overflow = 'hidden';
    }

    // --- Logout ---
    document.getElementById('btnLogout').addEventListener('click', () => {
      if (socket) socket.disconnect();
      localStorage.removeItem('chat_token');
      localStorage.removeItem('chat_user');
      window.location.href = '/';
    });

    // --- Init ---
    connectSocket();
  </script>
</body>
</html>
