<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat Realtime – Login</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 2rem;
      width: 380px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { text-align: center; color: #667eea; margin-bottom: 1.5rem; font-size: 1.8rem; }
    .tabs { display: flex; margin-bottom: 1.5rem; border-bottom: 2px solid #eee; }
    .tab {
      flex: 1; padding: 0.75rem; text-align: center; cursor: pointer;
      font-weight: 600; color: #999; border-bottom: 2px solid transparent;
      margin-bottom: -2px; transition: all 0.2s;
    }
    .tab.active { color: #667eea; border-bottom-color: #667eea; }
    .form { display: none; }
    .form.active { display: block; }
    .field { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 0.3rem; font-weight: 600; }
    input {
      width: 100%; padding: 0.7rem 1rem; border: 2px solid #e0e0e0;
      border-radius: 8px; font-size: 1rem; transition: border 0.2s;
    }
    input:focus { outline: none; border-color: #667eea; }
    button {
      width: 100%; padding: 0.85rem; background: #667eea; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background 0.2s; margin-top: 0.5rem;
    }
    button:hover { background: #5a6fd6; }
    .error { color: #e53e3e; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }
    .success { color: #38a169; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="card">
    <h1>💬 ChatIO</h1>
    <div class="tabs">
      <div class="tab active" data-tab="login">Iniciar sesión</div>
      <div class="tab" data-tab="register">Registrarse</div>
    </div>

    <!-- Login Form -->
    <form class="form active" id="loginForm">
      <div class="field">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="tu@email.com" required />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="loginPassword" placeholder="••••••" required />
      </div>
      <button type="submit">Entrar</button>
      <div id="loginMsg"></div>
    </form>

    <!-- Register Form -->
    <form class="form" id="registerForm">
      <div class="field">
        <label>Username</label>
        <input type="text" id="regUsername" placeholder="tu_nombre" required minlength="3" />
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="regEmail" placeholder="tu@email.com" required />
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="regPassword" placeholder="mínimo 6 caracteres" required minlength="6" />
      </div>
      <button type="submit">Crear cuenta</button>
      <div id="registerMsg"></div>
    </form>
  </div>

  <script>
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(tab.dataset.tab + 'Form').classList.add('active');
      });
    });

    // Redirect if already logged in
    if (localStorage.getItem('chat_token')) {
      window.location.href = '/chat.html';
    }

    // Login
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      msg.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('loginEmail').value,
            password: document.getElementById('loginPassword').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.className = 'error';
          msg.textContent = data.message || 'Error al iniciar sesión';
          return;
        }
        localStorage.setItem('chat_token', data.token);
        localStorage.setItem('chat_user', JSON.stringify(data.user));
        window.location.href = '/chat.html';
      } catch {
        msg.className = 'error';
        msg.textContent = 'Error de conexión';
      }
    });

    // Register
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('registerMsg');
      msg.textContent = '';
      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('regUsername').value,
            email: document.getElementById('regEmail').value,
            password: document.getElementById('regPassword').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          msg.className = 'error';
          msg.textContent = data.message || 'Error al registrarse';
          return;
        }
        localStorage.setItem('chat_token', data.token);
        localStorage.setItem('chat_user', JSON.stringify(data.user));
        window.location.href = '/chat.html';
      } catch {
        msg.className = 'error';
        msg.textContent = 'Error de conexión';
      }
    });
  </script>
</body>
</html>
